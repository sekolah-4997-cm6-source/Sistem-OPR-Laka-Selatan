<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem e-OPR SK Laka Selatan</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Tailwind CSS CDN & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { kurikulum: '#1d4ed8', hem: '#dc2626', koko: '#15803d' }
                }
            }
        }
    </script>

    <!-- HUBUNGAN KE FAIL CSS ANDA -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 antialiased text-gray-800">

    <!-- 1. SPLASH SCREEN -->
    <div id="splashScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-blue-900 transition-opacity duration-1000">
        <div id="splashContent" class="text-center opacity-0 transform scale-80 text-white">
            <i class="fa-solid fa-file-signature text-6xl mb-4"></i>
            <h1 class="text-3xl font-bold tracking-wider">Sistem e-OPR</h1>
            <p class="mt-2 text-blue-200">SK Laka Selatan</p>
        </div>
    </div>

    <!-- 2. HEADER & NAVIGATION -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-school"></i>
                </div>
                <div>
                    <h1 class="font-bold text-gray-800 leading-tight">Penjana OPR</h1>
                    <p class="text-xs text-gray-500">Versi 2.0 (Gemini AI)</p>
                </div>
            </div>
            <button onclick="showAdminModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>

        <div class="bg-gray-50 border-t border-gray-100">
            <div class="max-w-5xl mx-auto px-4 py-2 flex justify-between text-xs font-medium">
                <span id="step-nav-1" class="step-nav-item text-blue-500 font-bold flex items-center space-x-1"><i class="fa-solid fa-1"></i><span>Asas</span></span>
                <span id="step-nav-2" class="step-nav-item text-slate-400 flex items-center space-x-1"><i class="fa-solid fa-2"></i><span>Butiran</span></span>
                <span id="step-nav-3" class="step-nav-item text-slate-400 flex items-center space-x-1"><i class="fa-solid fa-3"></i><span>Laporan</span></span>
                <span id="step-nav-4" class="step-nav-item text-slate-400 flex items-center space-x-1"><i class="fa-solid fa-4"></i><span>Pratonton</span></span>
            </div>
        </div>
    </header>

    <!-- 3. MAIN CONTENT WIZARD -->
    <main class="max-w-5xl mx-auto px-4 py-6 mb-20">
        
        <!-- LANGKAH 1 -->
        <div id="step-1" class="step-panel active bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2"><i class="fa-solid fa-layer-group mr-2 text-blue-500"></i>Langkah 1: Maklumat Asas</h2>
            
            <div class="mb-5">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Kategori OPR</label>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="updateCategoryTheme('kurikulum')" class="py-2 border rounded-lg text-sm font-medium hover:bg-blue-50 focus:ring-2 focus:ring-blue-500">Kurikulum</button>
                    <button onclick="updateCategoryTheme('hem')" class="py-2 border rounded-lg text-sm font-medium hover:bg-red-50 focus:ring-2 focus:ring-red-500">HEM</button>
                    <button onclick="updateCategoryTheme('koko')" class="py-2 border rounded-lg text-sm font-medium hover:bg-emerald-50 focus:ring-2 focus:ring-emerald-500">Kokurikulum</button>
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Nama Guru Pelapor</label>
                <select id="selectNamaGuru" onchange="handleGuruChange(this.value)" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-gray-50"></select>
                <div id="wrapperNamaManual" class="mt-3 hidden">
                    <input type="text" id="inputNamaGuruManual" placeholder="Taip nama penuh guru..." class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <div class="text-right mt-6">
                <button onclick="goToStep(2)" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">Seterusnya <i class="fa-solid fa-arrow-right ml-1"></i></button>
            </div>
        </div>

        <!-- LANGKAH 2 -->
        <div id="step-2" class="step-panel bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2"><i class="fa-solid fa-calendar-day mr-2 text-blue-500"></i>Langkah 2: Butiran Program</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">Nama Program</label><input type="text" id="namaProgram" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">Tarikh</label><input type="date" id="tarikhProgram" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">Masa Mula</label><input type="time" id="masaMula" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">Masa Selesai</label><input type="time" id="masaSelesai" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">Tempat</label><input type="text" id="tempatProgram" list="senaraiTempat" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"><datalist id="senaraiTempat"></datalist></div>
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">Sasaran</label><input type="text" id="sasaranProgram" list="senaraiSasaran" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"><datalist id="senaraiSasaran"></datalist></div>
            </div>

            <h3 class="text-sm font-bold text-gray-800 mb-3 mt-6">Muat Naik 5 Gambar Aktiviti</h3>
            <div id="imageSlotsContainer" class="grid grid-cols-2 md:grid-cols-5 gap-3"></div>

            <div class="flex justify-between mt-6">
                <button onclick="goToStep(1)" class="text-gray-500 px-4 py-2 hover:bg-gray-100 rounded-lg"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali</button>
                <button onclick="goToStep(3)" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">Seterusnya <i class="fa-solid fa-arrow-right ml-1"></i></button>
            </div>
        </div>

        <!-- LANGKAH 3 -->
        <div id="step-3" class="step-panel bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center border-b pb-2 mb-4">
                <h2 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-pen-nib mr-2 text-blue-500"></i>Langkah 3: Teks Laporan</h2>
                <button id="btnAiEnhance" onclick="enhanceContentWithAI()" class="bg-gradient-to-r from-purple-500 to-indigo-600 text-white text-xs px-3 py-1.5 rounded shadow hover:shadow-md transition">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Perkemas dgn AI
                </button>
            </div>

            <div class="space-y-4">
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">Objektif Program</label><textarea id="objektifInput" rows="2" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea></div>
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">Impak / Ringkasan Aktiviti</label><textarea id="impakInput" rows="3" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-semibold text-gray-700 mb-1">Kekuatan</label><textarea id="kekuatanInput" rows="2" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea></div>
                    <div><label class="block text-sm font-semibold text-gray-700 mb-1">Kelemahan & Penambahbaikan</label><textarea id="kelemahanInput" rows="2" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea></div>
                </div>
            </div>

            <div class="flex justify-between mt-6">
                <button onclick="goToStep(2)" class="text-gray-500 px-4 py-2 hover:bg-gray-100 rounded-lg"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali</button>
                <button onclick="goToStep(4)" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">Seterusnya <i class="fa-solid fa-arrow-right ml-1"></i></button>
            </div>
        </div>

        <!-- LANGKAH 4 -->
        <div id="step-4" class="step-panel">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Pautan Dokumentasi (Jana QR)</label>
                    <input type="url" id="linkDokumentasi" oninput="generateQrCode(this.value)" placeholder="Cth: https://drive.google.com/..." class="w-full p-2 text-sm border rounded-lg">
                    <div id="qrcodeHidden" class="hidden"></div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1 flex justify-between">
                        Tandatangan Digital <button onclick="clearSignature()" class="text-red-500 text-xs hover:underline">Padam</button>
                    </label>
                    <canvas id="signatureCanvas" width="300" height="80" class="border border-dashed border-gray-300 rounded bg-gray-50 w-full sig-canvas"></canvas>
                </div>
            </div>

            <div class="a4-preview-wrapper bg-gray-200 p-4 rounded-xl overflow-x-auto flex justify-center mb-6">
                <div id="opr-print-area" class="a4-page p-8 text-gray-800 text-sm">
                    <div id="oprHeaderBanner" class="border-b-4 border-blue-700 pb-3 mb-4 flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <!-- Gantikan src dengan link logo KPM sebenar anda -->
                            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e4/Kementerian_Pendidikan_Malaysia_Logo.png" class="h-16 object-contain" alt="Logo KPM">
                        </div>
                        <div class="text-right">
                            <h1 class="text-xl font-bold uppercase">One Page Report</h1>
                            <span id="oprTagKategori" class="inline-block mt-1 bg-blue-700 text-white text-[9px] font-bold px-2 py-0.5 rounded uppercase">KURIKULUM</span>
                        </div>
                    </div>

                    <!-- Dynamic Layout Area -->
                    <div id="oprDynamicContent">
                        <!-- Disuntik melalui JS -->
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center mt-6">
                <button onclick="goToStep(3)" class="text-gray-500 px-4 py-2 hover:bg-gray-100 rounded-lg"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali</button>
                <div class="space-x-2 flex">
                    <button onclick="printOPR()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700"><i class="fa-solid fa-print mr-1"></i> PDF</button>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL NOTIFIKASI -->
    <div id="notificationModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white p-6 rounded-lg max-w-sm w-full mx-4 text-center">
            <h3 id="modalTitle" class="text-lg font-bold mb-2">Perhatian</h3>
            <p id="modalMessage" class="text-sm text-gray-600 mb-4"></p>
            <button onclick="closeModal('notificationModal')" class="bg-blue-600 text-white px-4 py-2 rounded">Tutup</button>
        </div>
    </div>

    <!-- TEMPLATE SLOT IMEJ -->
    <template id="slot-template">
        <div class="relative border-2 border-dashed border-gray-300 rounded-lg h-24 md:h-32 flex flex-col items-center justify-center bg-gray-50 overflow-hidden group cursor-pointer hover:bg-gray-100 transition" onclick="document.getElementById('imgUpload-INDEX').click()">
            <input type="file" id="imgUpload-INDEX" accept="image/*" class="hidden" onchange="processImageUpload(this, INDEX)">
            <div id="placeholder-img-INDEX" class="text-center p-2">
                <i class="fa-solid fa-camera text-gray-400 text-xl mb-1"></i>
                <p class="text-[10px] text-gray-500 font-medium">Gambar INDEX+1</p>
            </div>
            <img id="preview-img-INDEX" class="absolute inset-0 w-full h-full object-cover hidden" alt="Pratonton">
            <button id="remove-btn-INDEX" onclick="event.stopPropagation(); removeImage(INDEX)" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs hidden shadow"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </template>

    <!-- HUBUNGAN KE FAIL JAVASCRIPT ANDA -->
    <script src="script.js"></script>
</body>
</html>
